name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a deploy in flight: Pages tracks one deployment at a time, and
  # killing it halfway leaves the site on the old build with a stuck deployment.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung install should fail in minutes, not sit on a runner for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm has hung here before — eight silent minutes inside `npm ci`, then
      # "Exit handler never called!", which is npm giving up on its own stalled
      # registry request. Bounded fetches turn that stall into a normal failure,
      # and the second attempt covers the flake.
      - name: Install dependencies
        run: |
          install() { npm ci --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=3; }
          install || { echo "npm ci failed, retrying once"; rm -rf node_modules; install; }
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
